name: CI

# 本仓库公开（2026-08-29）后 Actions 不计量：分钟与 artifact 存储对公开仓库
# 免费，所以私有仓库时期的额度优化（macOS 折算约 10 倍、每 job 取整进位、
# 打包纯净度只留每周定时）全部随公开化移除——每次 push/PR 都跑完整矩阵：
# Linux/Windows/macOS 测试、三平台冒烟、双平台原生打包与 app.asar 纯净度。
# 公开前的历史取整/折算记录保留在 poppet-dev 开发仓库的文档里。
#
# 注意不能改用 paths-ignore 按路径跳过：test/packaging/public-surface.test.mjs
# 断言 README/SECURITY/docs 的内容，test/core-loop/ 会读 docs/reports/ 下的
# 提交数据文件，按路径跳过会真的漏掉能抓到问题的测试。压 job 的频率是安全的，跳测试不是。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每周一 04:00 UTC 的全量兜底（捕捉 runner 镜像漂移；push 已覆盖功能场景）
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Electron's npm postinstall (@electron/get) downloads Electron into the
      # per-OS default cache below, outside setup-node's npm cache. Paths for
      # other operating systems simply do not resolve and are ignored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm audit --audit-level=high

  package:
    needs: [test, audit]
    # 打包纯净度对每次提交都验证：公开仓库 Actions 不计量，没有理由让
    # 双平台原生打包与 app.asar 纯度只留在每周定时上。成功时不保存任何
    # installer（collect-release-assets 只在 runner 临时磁盘上核对期望的
    # 发布文件集 + SHA-256 并 PASS/FAIL）。
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            command: npm run pack:mac
          - platform: windows
            os: windows-latest
            command: npm run pack:win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # electron-builder downloads the Electron zip for every packaged arch into
      # the same per-OS default cache as the npm postinstall. The path list must
      # stay byte-identical to the test job's so that the second restore key can
      # seed a cold package run from the test cache; the exact key is distinct
      # because cache entries are immutable once saved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-package-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-package-${{ runner.os }}-
            electron-${{ runner.os }}-
      # NSIS, winCodeSign, and other electron-builder toolsets go to
      # ELECTRON_BUILDER_CACHE (set below); the directory is git-ignored and is
      # outside the package.json build.files allowlist.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - run: npm ci
      # macOS 的测试覆盖挂在这里而不是单独一个 job：单独跑要额外计 10.33 分钟额度，
      # 挂进来只是把本 job 的 2.25 分钟推到 2.72，取整后仍是 3 分钟。
      # matrix 上下文在 steps.if 里可用（在 job 级 if: 里不可用）。
      - if: matrix.platform == 'macos'
        run: npm test
      - run: ${{ matrix.command }}
      - run: npm run verify:package
      # collect-release-assets 只在 runner 的临时磁盘上核对"期望的发布文件集 +
      # SHA-256"并 PASS/FAIL；这个 job 的目的是验证，不是保存安装包。完整
      # installer 不再上传 Actions Artifact storage——它们 400-700MB、7 天后即
      # 丢弃，历史上还挤爆过私有仓库的存储配额。跨 job 传递完整产物是 release.yml
      # 发布通道的职责（那里有 manifest/哈希校验与受保护环境），普通 CI 不做。
      # 回归测试：test/tooling/ci-artifact-hygiene.test.mjs。
      - run: node .github/scripts/collect-release-assets.mjs ${{ matrix.platform }}

  # 这里是**唯一**在托管环境里真正启动 Electron 进程的地方——其余 job 都是 Node 级。
  # 三个冒烟合并在一个 job 里跑（渲染节拍/点击拖拽、导入保存恢复、多窗口 IPC 各自
  # 覆盖一半），Windows 与 macOS 每次提交都跑。
  smoke:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Electron's npm postinstall (@electron/get) downloads Electron into the
      # per-OS default cache below, outside setup-node's npm cache. Paths for
      # other operating systems simply do not resolve and are ignored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: npm ci
      # 三个冒烟覆盖不同的一半：manager 是导入/保存/重启恢复，click 是"跑起来之后
      # 还认不认得点击与拖拽"，multi 是多窗口的 IPC 路由与各自位置持久化。
      # 后两个此前从未在托管 CI 上跑过，而今天的骨架改动正好动了 brain/pet/sprite/
      # render-policy —— 那恰恰是 click 覆盖的那一半。
      - run: npm run test:manager
      - run: npm run test:click
      - run: npm run test:multi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-diagnostics-${{ matrix.os }}-${{ github.sha }}
          path: |
            .artifacts/
            .artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7
