name: CI

# 私有仓库的 Actions 额度按平台折算，而且**每个 job 先各自向上取整到整分钟**再折算。
# 核实于 2026-08-25：GitHub 已不再发布"倍率表"，改为按分钟单价
# （Linux 2-core $0.006 / Windows 2-core $0.010 / macOS $0.062），换算成
# Linux 当量约 1x / 1.67x / 10.33x。Free 个人账号每月 2,000 分钟。
#
# 取整是这里最反直觉的部分：实测一次全量运行真实耗时 8.7 分钟，各 job 取整后是
# 13 个 runner 分钟，折算成额度是 ~55 分钟——每月只够约 36 次。macOS 占其中 75%。
# 最极端的一条：macOS 上那个 0.47 分钟的测试 job 要计 10.33 分钟额度，
# 28 秒的活按 10 分钟 Linux 收费。所以它被折进下面的 macOS 打包 job 里
# （2.25 + 0.47 仍然进位到 3 分钟），整条省掉。
#
# 其余按"每次提交"和"发布证据"分开：每次推送跑 Linux/Windows 的全部测试与冒烟
# （约 10 分钟额度），打包纯净度改为每周定时 + 手动触发。
#
# 注意不能改用 paths-ignore 按路径跳过：test/packaging/public-surface.test.mjs
# 断言 README/SECURITY/docs 的内容，test/core-loop/ 会读 docs/reports/ 下的
# 提交数据文件，按路径跳过会真的漏掉能抓到问题的测试。压 job 的频率是安全的，跳测试不是。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每周一 04:00 UTC 跑一次全量，包含 macOS 与打包纯净度
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS 不在这里：一个不到半分钟的 job 要计 10.33 分钟额度，
        # 折进 macOS 打包 job 是净省。跨平台测试证据因此随打包同一条节奏产生。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Electron's npm postinstall (@electron/get) downloads Electron into the
      # per-OS default cache below, outside setup-node's npm cache. Paths for
      # other operating systems simply do not resolve and are ignored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm audit --audit-level=high

  package:
    needs: [test, audit]
    # 打包纯净度是**发布闸门**，不是每次提交的信号：release.yml 在打 tag 时本来
    # 就会完整跑一遍，那才是发布证据真正需要的时刻。这里保留每周与手动两条路。
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            command: npm run pack:mac
          - platform: windows
            os: windows-latest
            command: npm run pack:win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # electron-builder downloads the Electron zip for every packaged arch into
      # the same per-OS default cache as the npm postinstall. The path list must
      # stay byte-identical to the test job's so that the second restore key can
      # seed a cold package run from the test cache; the exact key is distinct
      # because cache entries are immutable once saved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-package-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-package-${{ runner.os }}-
            electron-${{ runner.os }}-
      # NSIS, winCodeSign, and other electron-builder toolsets go to
      # ELECTRON_BUILDER_CACHE (set below); the directory is git-ignored and is
      # outside the package.json build.files allowlist.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - run: npm ci
      # macOS 的测试覆盖挂在这里而不是单独一个 job：单独跑要额外计 10.33 分钟额度，
      # 挂进来只是把本 job 的 2.25 分钟推到 2.72，取整后仍是 3 分钟。
      # matrix 上下文在 steps.if 里可用（在 job 级 if: 里不可用）。
      - if: matrix.platform == 'macos'
        run: npm test
      - run: ${{ matrix.command }}
      - run: npm run verify:package
      # collect-release-assets 只在 runner 的临时磁盘上核对"期望的发布文件集 +
      # SHA-256"并 PASS/FAIL；这个 job 的目的是验证，不是保存安装包。完整
      # installer 不再上传 Actions Artifact storage——它们 400-700MB、7 天后即
      # 丢弃，历史上还挤爆过私有仓库的存储配额。跨 job 传递完整产物是 release.yml
      # 发布通道的职责（那里有 manifest/哈希校验与受保护环境），普通 CI 不做。
      # 回归测试：test/tooling/ci-artifact-hygiene.test.mjs。
      - run: node .github/scripts/collect-release-assets.mjs ${{ matrix.platform }}

  # 这里是**唯一**在托管环境里真正启动 Electron 进程的地方——其余 job 都是 Node 级。
  # 三个冒烟合并在一个 job 里跑，因为计费按 job 向上取整：分成三个 job 要付三次进位，
  # 合在一起只把这一个 job 从 2 分钟推到 3 分钟。
  # macOS 只在非 push 事件上跑（10.33 倍计费），Windows 每次推送都跑。
  smoke:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Electron's npm postinstall (@electron/get) downloads Electron into the
      # per-OS default cache below, outside setup-node's npm cache. Paths for
      # other operating systems simply do not resolve and are ignored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: npm ci
      # 三个冒烟覆盖不同的一半：manager 是导入/保存/重启恢复，click 是"跑起来之后
      # 还认不认得点击与拖拽"，multi 是多窗口的 IPC 路由与各自位置持久化。
      # 后两个此前从未在托管 CI 上跑过，而今天的骨架改动正好动了 brain/pet/sprite/
      # render-policy —— 那恰恰是 click 覆盖的那一半。
      - run: npm run test:manager
      - run: npm run test:click
      - run: npm run test:multi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-diagnostics-${{ matrix.os }}-${{ github.sha }}
          path: |
            .artifacts/
            .artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7
