<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Poppet</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }
    #stage {
      display: block;
      width: 100%;
      height: 100%;
      /* 缩放时保持像素硬边，别让浏览器插值把像素画糊掉 */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script type="module" src="pet.js"></script>
</body>
</html>
